[project]
name = "ejercicio-final"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anto-rom", email = "anto-rom@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ejercicio-final = "ejercicio_final:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]